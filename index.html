<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#20252b">
<link rel="manifest" href="manifest.json">
<title>Ash Call</title>
<style>
:root{--bg:#ecefea;--card:#fff;--ink:#1d2329;--muted:#687078;--line:#d8ddd8;--dark:#20252b;--green:#2f7d47;--red:#b63d3d;--soft:#f4f6f2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}
header,main{max-width:760px;margin:auto}header{padding:18px 16px 8px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:23px;font-weight:800}.status{font-size:13px;color:var(--muted)}
main{padding:10px 16px 110px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 8px 28px #0000000d}
.row{display:flex;gap:10px;flex-wrap:wrap}.grow{flex:1}input,button{font:inherit}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px}
button{border:0;border-radius:14px;padding:13px 16px;font-weight:750}.dark{background:var(--dark);color:#fff}.green{background:var(--green);color:#fff}.red{background:var(--red);color:#fff}.soft{background:var(--soft)}
.video{position:relative;margin-top:14px;background:#111;border-radius:22px;overflow:hidden;aspect-ratio:9/16;max-height:64dvh}
video{background:#111}#remote{width:100%;height:100%;object-fit:cover}#local{position:absolute;right:12px;top:12px;width:30%;aspect-ratio:3/4;object-fit:cover;border-radius:16px;border:2px solid #ffffffbb}
.placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#ccd1d4;text-align:center;padding:28px;pointer-events:none}.hide{display:none!important}
.notice{margin-top:12px;padding:13px;border:1px solid var(--line);border-radius:15px;background:#f4f6f2}
.controls{position:fixed;z-index:9;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:9px;padding:10px;background:#fffffff0;border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 30px #0002}
.icon{width:52px;height:52px;padding:0;font-size:20px;border-radius:18px}
@media(min-width:700px){.video{aspect-ratio:16/10}}
</style>
</head>
<body>
<header><div><div class="brand">Ash Call</div><div class="status" id="status">Offline</div></div><button id="install" class="soft" hidden>Install</button></header>
<main><div class="card">
<div class="row"><div class="grow"><input id="name" placeholder="Your name"></div><button id="online" class="dark">Go online</button></div>
<div style="height:10px"></div>
<input id="roomCode" placeholder="Private room code — use the same code on both phones">
<div id="peerState" class="notice">Enter the same room code on both phones, then tap Go online.</div>
<div id="incoming" class="notice hide"><b id="incomingText">Incoming call</b><div class="row" style="margin-top:10px"><button id="answer" class="green">Answer</button><button id="decline" class="red">Decline</button></div></div>
<div class="video"><video id="remote" autoplay playsinline></video><video id="local" autoplay playsinline muted></video><div id="placeholder" class="placeholder">Camera stays off until you call or answer.</div></div>
<div class="row" style="margin-top:12px"><button id="call" class="green">Call</button><button id="offline" class="soft">Go offline</button></div>
</div></main>
<div class="controls"><button id="mic" class="icon soft">🎙️</button><button id="cam" class="icon soft">📷</button><button id="share" class="icon soft">🖥️</button><button id="hang" class="icon red">☎️</button></div>

<script type="module">
import { joinRoom } from 'https://esm.run/trystero@0.22.0';

const $=x=>document.getElementById(x);
let room=null, localStream=null, currentPeer=null, incomingPeer=null, deferredInstall=null;
let sendRing,onRing,sendAnswer,onAnswer,sendDecline,onDecline,sendHang,onHang,sendName,onName;
const names=new Map();

function setStatus(s){$('status').textContent=s}
function peers(){return room ? Object.keys(room.getPeers()) : []}
function refresh(){
  const ps=peers();
  if(!room) $('peerState').textContent='Offline';
  else if(!ps.length) $('peerState').textContent='Online — waiting for the other phone…';
  else $('peerState').textContent='Ready — '+ps.length+' other phone'+(ps.length>1?'s':'')+' connected.';
}
async function media(){
  if(localStream)return localStream;
  localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:true});
  $('local').srcObject=localStream;$('placeholder').classList.add('hide');
  return localStream;
}
function stopMedia(){
  if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}
  $('local').srcObject=null;$('remote').srcObject=null;$('placeholder').classList.remove('hide');
}
function wire(){
  [sendRing,onRing]=room.makeAction('ring');
  [sendAnswer,onAnswer]=room.makeAction('answer');
  [sendDecline,onDecline]=room.makeAction('decline');
  [sendHang,onHang]=room.makeAction('hang');
  [sendName,onName]=room.makeAction('name');

  onName((data,peerId)=>{names.set(peerId,data?.name||'Peer');refresh()});
  onRing((data,peerId)=>{
    incomingPeer=peerId; names.set(peerId,data?.name||'Peer');
    $('incomingText').textContent='Incoming call from '+(data?.name||'Peer');
    $('incoming').classList.remove('hide');
  });
  onAnswer(async(_data,peerId)=>{
    currentPeer=peerId;
    const s=await media();
    room.addStream(s,peerId);
    setStatus('In call');
  });
  onDecline((_data,peerId)=>{
    if(currentPeer===peerId)currentPeer=null;
    setStatus('Online'); alert('Call declined.');
  });
  onHang(()=>{stopMedia();currentPeer=null;setStatus('Online')});

  room.onPeerJoin(peerId=>{
    sendName({name:$('name').value.trim()},peerId);
    refresh();
  });
  room.onPeerLeave(peerId=>{
    names.delete(peerId);
    if(peerId===currentPeer){stopMedia();currentPeer=null;setStatus('Online')}
    refresh();
  });
  room.onPeerStream((stream,peerId)=>{
    currentPeer=peerId;$('remote').srcObject=stream;setStatus('In call');
  });
}
$('online').onclick=()=>{
  const name=$('name').value.trim(), code=$('roomCode').value.trim();
  if(!name)return alert('Enter your name first.');
  if(!code)return alert('Enter a private room code.');
  if(room)room.leave();
  try{
    /* Trystero room config belongs in the first argument; room ID is second. */
    room=joinRoom({appId:'ash-call-pwa'},code);
    wire();
    localStorage.setItem('ash-name',name);localStorage.setItem('ash-room',code);
    setStatus('Online');refresh();
  }catch(e){console.error(e);room=null;setStatus('Connection error');$('peerState').textContent='Could not join the room. Check internet connection and reload.'}
};
$('call').onclick=async()=>{
  if(!room)return alert('Tap Go online first.');
  const ps=peers(); if(!ps.length)return alert('The other phone is not online in this room yet.');
  currentPeer=ps[0];
  await media();
  await sendRing({name:$('name').value.trim()},currentPeer);
  setStatus('Calling…');
};
$('answer').onclick=async()=>{
  if(!room||!incomingPeer)return;
  currentPeer=incomingPeer;$('incoming').classList.add('hide');
  const s=await media();
  room.addStream(s,currentPeer);
  await sendAnswer({ok:true},currentPeer);
  incomingPeer=null;setStatus('In call');
};
$('decline').onclick=async()=>{
  if(room&&incomingPeer)await sendDecline({},incomingPeer);
  incomingPeer=null;$('incoming').classList.add('hide');
};
function end(notify=true){
  if(notify&&room&&currentPeer)sendHang({},currentPeer).catch(()=>{});
  if(room&&localStream){try{room.removeStream(localStream,currentPeer)}catch(e){}}
  stopMedia();currentPeer=null;
}
$('hang').onclick=()=>{end(true);if(room)setStatus('Online')};
$('offline').onclick=()=>{end(true);if(room){room.leave();room=null}names.clear();setStatus('Offline');refresh()};
$('mic').onclick=()=>{const t=localStream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('mic').textContent=t.enabled?'🎙️':'🔇'}};
$('cam').onclick=()=>{const t=localStream?.getVideoTracks()[0];if(t){t.enabled=!t.enabled;$('cam').textContent=t.enabled?'📷':'🚫'}};
$('share').onclick=async()=>{
  if(!room||!currentPeer||!localStream)return alert('Start a call first.');
  try{
    const screen=await navigator.mediaDevices.getDisplayMedia({video:true});
    const old=localStream.getVideoTracks()[0], neu=screen.getVideoTracks()[0];
    room.replaceTrack(old,neu,currentPeer);$('local').srcObject=screen;
    neu.onended=()=>{try{room.replaceTrack(neu,old,currentPeer)}catch(e){};$('local').srcObject=localStream}
  }catch(e){}
};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('install').hidden=false});
$('install').onclick=async()=>{if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;$('install').hidden=true}};
$('name').value=localStorage.getItem('ash-name')||'';$('roomCode').value=localStorage.getItem('ash-room')||'';
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script>
</body></html>
